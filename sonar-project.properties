# Alcance del analisis: solo el codigo de la API. El cliente web y la
# infraestructura se revisan con Semgrep y tfsec en sus propios pasos.
sonar.projectKey=TaskFlowApi
sonar.projectName=TaskFlow API
sonar.organization=upt-lab-calidad

sonar.sources=TaskFlow.Api,TaskFlow.Api.Tests
sonar.sourceEncoding=UTF-8
sonar.projectBaseDir=.

sonar.cs.opencover.reportsPaths=**/coverage.cobertura.xml
sonar.coverage.exclusions=**/Migrations/**,**/Program.cs,**/Properties/**

# Las migraciones son generadas por EF Core y no se revisan a mano.
sonar.exclusions=**/bin/**,**/obj/**,**/Migrations/**,**/Properties/**,**/doc/**,**/web/**,**/infra/**,**/herramientas/**,**/.github/**

sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
