name: SonarQube

# Examen Unidad 1 · SI-784
# Escaneo estatico del codigo con SonarCloud y publicacion de metricas.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  sonar:
    name: Analisis
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: taskflow
          POSTGRES_PASSWORD: taskflow_password
          POSTGRES_DB: taskflow
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restaurar
        run: dotnet restore

      - name: Compilar sin restaurar
        run: dotnet build --no-restore --configuration Debug

      - name: Pruebas con cobertura
        run: |
          dotnet test --no-build --collect:"XPlat Code Coverage" --results-directory ./coverage
        env:
          TASKFLOW_TEST_DB: "Host=localhost;Port=5432;Database=taskflow;Username=taskflow;Password=taskflow_password"

      - name: SonarCloud scan
        uses: SonarSource/sonarcloud-github-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

      - name: Quality gate
        uses: SonarSource/sonarcloud-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
