# TaskFlow en Render
# El plan gratuito sirve el servicio web; la base PostgreSQL se crea aparte.
services:
  - type: web
    name: taskflow-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_HTTP_PORTS
        value: 8080
      # La base se crea en Render Postgres o en cualquier proveedor; su URL
      # llega como variable de entorno y nunca se versiona.
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: Jwt__Key
        generateValue: true
      - key: Jwt__Issuer
        value: TaskFlow.Api
      - key: Jwt__Audience
        value: TaskFlow.Client
