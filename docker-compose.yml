# TaskFlow · ejecucion completa en local
# PostgreSQL y la API en contenedor, sin necesitar nada instalado salvo Docker.
services:
  postgres:
    image: postgres:16-alpine
    container_name: taskflow-postgres
    environment:
      POSTGRES_DB: taskflow
      POSTGRES_USER: prodriguez
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taskflow_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - datos-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prodriguez -d taskflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: taskflow-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=taskflow;Username=prodriguez;Password=${POSTGRES_PASSWORD:-taskflow_dev_password}"
      Jwt__Key: "clave-de-desarrollo-cambiar-en-produccion-taskflow-si784-2026"
      Jwt__Issuer: "TaskFlow.Api"
      Jwt__Audience: "TaskFlow.Client"
      Cors__Origins__0: "http://localhost:8090"
    ports:
      - "8080:8080"

volumes:
  datos-postgres:
